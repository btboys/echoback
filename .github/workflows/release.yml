name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_android:
    name: Build Android APK / AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable

      - run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ -d "$SDK" ]; then
            BT=$(ls "$SDK/build-tools/" | head -1)
            if [ -n "$BT" ] && [ "$BT" != "29.0.3" ]; then
              ln -s "$SDK/build-tools/$BT" "$SDK/build-tools/29.0.3"
            fi
          fi

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          body: |
            ## EchoBack ${{ github.ref_name }}

            请从下方 Assets 下载对应文件：

            - `app-release.apk` — 直接安装包
            - `app-release.aab` — Google Play 上传包

            ### 更新内容

            请查看 [CHANGELOG.md](./CHANGELOG.md) 了解详情。
          generate_release_notes: true
