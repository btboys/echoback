name: echoback
description: "Ear-monitor app for real-time audio monitoring on mobile."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  record: ^5.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^11.0.2
  just_audio: ^0.9.43
  sqflite: ^2.4.2
  path: ^1.9.0
  intl: ^0.20.2

dependency_overrides:
  record_platform_interface: 1.5.0
  record_linux: 0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
